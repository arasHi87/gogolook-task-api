name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum are stale — run 'go mod tidy' and commit"; exit 1; }

      - name: vet
        run: go vet ./...

      # -race and -covermode=atomic together: the queue is a concurrency
      # exercise, so a data race is a test failure, not a warning.
      - name: unit tests
        run: go test -race -short -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: build
        run: go build -trimpath ./...

  proto:
    name: proto & generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking needs history to compare against main
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: buf lint
        run: buf lint

      # A breaking change to the wire contract should be a deliberate act, not
      # something noticed by a client.
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=origin/main'

      # The committed gen/ and docs/openapi.yaml cannot drift from the proto:
      # regenerate and require no diff.
      - name: generated output is current
        run: |
          buf generate
          git diff --exit-code -- gen docs/openapi.yaml \
            || { echo "::error::generated output is stale — run 'make generate' and commit"; exit 1; }

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
