# Developer entrypoints. Everything CI runs is a task here, so a green `task ci`
# locally means a green pipeline.
#
#   task            list the tasks
#   task run        the API on the in-memory store, no dependencies
#   task ci         vet, lint, test — what the pipeline runs
version: "3"

vars:
  BIN: bin/taskapi
  PKG: ./...
  MODULE: github.com/arasHi87/gogolook-task-api
  # Derived from git, overridable for a reproducible release build.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X main.version={{.VERSION}}
    -X main.commit={{.COMMIT}}
    -X main.date={{.DATE}}
  COMPOSE: docker compose -f deploy/compose.yaml

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Compile the binary into bin/
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN}}"
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BIN}} ./cmd/taskapi

  run:
    desc: Run the API with the in-memory store (no Docker, no Postgres)
    cmds:
      - go run ./cmd/taskapi all {{.CLI_ARGS}}

  fmt:
    desc: Format the tree
    cmds:
      - gofmt -l -w $(git ls-files '*.go' | grep -v '^gen/')

  vet:
    desc: go vet
    cmds:
      - go vet {{.PKG}}

  lint:
    desc: golangci-lint
    cmds:
      - golangci-lint run --timeout=5m

  test:
    desc: Unit tests only (fast, no Docker)
    cmds:
      # -coverpkg so packages exercised from another package's tests — memrepo
      # through internal/task, for one — are attributed honestly.
      - go test -race -short -covermode=atomic -coverpkg={{.PKG}} -coverprofile=coverage.out {{.PKG}}

  test:integration:
    desc: Unit and integration tests against a real Postgres
    # Needs a Docker daemon. `task test` skips these with -short.
    #
    # test/e2e is excluded and has its own task: it builds and runs the binary,
    # which is a different tier with a different failure mode, and burying it
    # in a ./... run makes "the integration tests are slow" the diagnosis for a
    # process that would not start.
    cmds:
      - go test -race -covermode=atomic -coverpkg={{.PKG}} -coverprofile=coverage.out $(go list {{.PKG}} | grep -v '/test/e2e')

  e2e:
    desc: Live end-to-end suite — the shipped binary, real Postgres, two processes
    # Builds the binary and runs it: api and worker as separate processes
    # against a private database, driven over HTTP. Needs a Docker daemon.
    # `task e2e -- -run TestCrashed` narrows it to one case.
    cmds:
      - go test -race -count=1 -timeout=20m ./test/e2e/... {{.CLI_ARGS}}

  migrate:
    desc: Apply the schema to the database in TASKAPI_STORAGE_POSTGRES_DSN
    cmds:
      - go run ./cmd/taskapi migrate up {{.CLI_ARGS}}

  psql:
    desc: Open a shell on the stack's database
    cmds:
      - "{{.COMPOSE}} exec postgres psql -U taskapi -d taskapi"

  cover:
    desc: Open the HTML coverage report
    deps: [test]
    cmds:
      - go tool cover -html=coverage.out -o coverage.html
      - echo "wrote coverage.html"

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  tidy:check:
    desc: Fail if go.mod or go.sum are stale
    # This is in ci because its absence has a nasty shape: `go build` locally
    # succeeds from a warm module cache while the Docker build, which starts
    # from go.sum alone, fails with "missing go.sum entry". The whole test
    # suite goes green and the image does not exist.
    #
    # Compared against a snapshot rather than against git, so the answer is
    # "tidy would change something" rather than "the working tree is dirty" —
    # the second is true for every uncommitted edit and says nothing.
    silent: true
    cmds:
      - |
        snapshot=$(mktemp -d)
        cp go.mod go.sum "$snapshot/"
        go mod tidy
        if ! diff -q "$snapshot/go.mod" go.mod >/dev/null || ! diff -q "$snapshot/go.sum" go.sum >/dev/null; then
          rm -rf "$snapshot"
          echo "go.mod/go.sum were stale; 'go mod tidy' has just fixed them — commit the result"
          exit 1
        fi
        rm -rf "$snapshot"
        echo "go.mod and go.sum are tidy"

  generate:
    desc: Regenerate protobuf, Connect handlers and the OpenAPI document
    sources:
      - proto/**/*.proto
      - buf.yaml
      - buf.gen.yaml
      - buf.lock
    generates:
      - gen/**/*.go
      - docs/openapi.yaml
    cmds:
      - buf dep update
      - buf format -w
      - buf generate

  generate:check:
    desc: Fail if the generated output is stale (the CI drift gate)
    cmds:
      - task: generate
      - |
        git diff --exit-code -- gen docs/openapi.yaml proto \
          || { echo "generated output is stale — run 'task generate' and commit"; exit 1; }

  proto:lint:
    desc: buf lint, and buf breaking against main
    cmds:
      - buf lint
      - buf breaking --against '.git#branch=main' || true

  proto:deps:
    desc: Export the proto dependencies so an editor can resolve the imports
    # buf resolves these from its own module cache; editors cannot see it, which
    # is why every import shows as unresolved without this. The export is
    # gitignored and .vscode/settings.json points at it.
    cmds:
      - rm -rf .proto-deps
      - buf export . --output .proto-deps
      # Drop our own module from the export: it would shadow the real source
      # with a stale copy the editor might resolve against.
      - |
        for dir in proto/*/; do rm -rf ".proto-deps/$(basename "$dir")"; done
      - echo "exported to .proto-deps"

  docker:check-go:
    desc: Fail if the Dockerfile builds with an older Go than go.mod requires
    # There is no way for a Dockerfile to read go.mod, so the two are pinned
    # together here instead of by hope.
    silent: true
    cmds:
      - |
        want=$(awk '/^go /{print $2}' go.mod | cut -d. -f1,2)
        have=$(awk -F'golang:' '/^FROM golang:/{split($2,a,"-"); print a[1]}' Dockerfile | cut -d. -f1,2)
        if [ "$(printf '%s\n%s\n' "$want" "$have" | sort -V | head -1)" != "$want" ]; then
          echo "Dockerfile builds with Go $have but go.mod requires $want"; exit 1
        fi
        echo "Dockerfile Go $have satisfies go.mod $want"

  docker:build:
    desc: Build the container image
    deps: [docker:check-go]
    cmds:
      - >-
        docker build
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT={{.COMMIT}}
        --build-arg DATE={{.DATE}}
        -t taskapi:{{.VERSION}} -t taskapi:latest .

  up:
    desc: Bring the local stack up (postgres, api, worker, sink, prometheus, grafana)
    cmds:
      - "{{.COMPOSE}} up -d --build"
      - |
        echo
        echo "  API        http://localhost:${API_PORT:-8080}/tasks"
        echo "  docs       http://localhost:${API_PORT:-8080}/docs"
        echo "  admin      http://localhost:${ADMIN_PORT:-9090}/metrics"
        echo "  Prometheus http://localhost:${PROMETHEUS_PORT:-9092}"
        echo "  Grafana    http://localhost:${GRAFANA_PORT:-3000}"
        echo "  Tempo      http://localhost:${TEMPO_PORT:-3200}"

  down:
    desc: Tear the stack down, including volumes
    cmds:
      - "{{.COMPOSE}} down -v"

  demo:crash:
    desc: Kill the worker mid-job and watch the lease reaper recover its work
    cmds:
      - ./test/demo/crash.sh

  demo:idempotency:
    desc: Send the same write twice and watch it happen once
    cmds:
      - ./test/demo/idempotency.sh

  demo:ratelimit:
    desc: Show the two limiter tiers, and what a refused caller is told
    cmds:
      - ./test/demo/ratelimit.sh

  demo:breaker:
    desc: Break the webhook receiver and watch the circuit open, then heal it
    cmds:
      - ./test/demo/breaker.sh

  load:
    desc: Send a minute of traffic at the running stack, so the graphs have something on them
    cmds:
      - |
        for i in $(seq 1 100); do
          curl -sf -o /dev/null "localhost:${API_PORT:-8080}/tasks"
          curl -sf -o /dev/null -X POST "localhost:${API_PORT:-8080}/tasks" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"load $i\",\"status\":0}"
          sleep 0.3
        done
        echo "done; see http://localhost:${GRAFANA_PORT:-3000}"

  dashboards:generate:
    desc: Regenerate the Grafana dashboard JSON
    sources:
      - deploy/grafana/dashboards.py
    generates:
      - deploy/grafana/dashboards/*.json
    cmds:
      - ./deploy/grafana/dashboards.py

  dashboards:stale:
    desc: Fail if the dashboard JSON does not match the generator
    silent: true
    cmds:
      - task: dashboards:generate
      - |
        git diff --exit-code -- deploy/grafana/dashboards \
          || { echo "dashboards are stale — run 'task dashboards:generate' and commit"; exit 1; }

  dashboards:check:
    desc: Run every Grafana panel query against the running Prometheus
    # A panel that returns nothing reads as "the system is idle" rather than
    # "this query is wrong", and nobody notices until the incident it was built
    # for. Needs `task up` and some traffic.
    cmds:
      - ./test/dashboards/check.py ${PROMETHEUS_PORT:-9092}

  metrics:
    desc: Print the service's own metrics, filtered to ours
    cmds:
      - curl -s localhost:${ADMIN_PORT:-9090}/metrics | grep -Ev '^(#|go_|process_|promhttp_)' | grep -v ' 0$'

  sink:
    desc: Report what the webhook sink has received
    cmds:
      - curl -s localhost:${SINK_PORT:-8081}/stats

  logs:
    desc: Follow the stack logs
    cmds:
      - "{{.COMPOSE}} logs -f"

  ci:
    desc: Everything CI runs, locally
    cmds:
      - task: tidy:check
      - task: vet
      - task: lint
      - task: test
      - task: docker:check-go

  verify:
    desc: The full gate before a commit — ci, then the suites that need Docker
    # ci is the fast half and runs first, so a formatting or vet failure costs
    # seconds rather than the several minutes the container suites take.
    cmds:
      - task: ci
      - task: test:integration
      - task: e2e
