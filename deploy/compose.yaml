# The local stack.
#
# Postgres, a one-shot migration, the API and the worker on top of it, a
# webhook receiver that can be told to misbehave, and the Prometheus/Grafana
# pair that watches all of it.
#
# `api` and `worker` run the same image with different subcommands, which is
# what shows the queue is genuinely decoupled: kill the worker and the API
# keeps serving, kill the API and the worker keeps draining.
name: taskapi

x-image: &image
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      VERSION: ${VERSION:-dev}
      COMMIT: ${COMMIT:-none}
      DATE: ${DATE:-unknown}
  image: taskapi:${VERSION:-dev}

# Sampling is 1.0 on a laptop: the demo is a few hundred requests and a
# partial trace of it is a partial demo. A real deployment samples down and
# keeps the tail with a tail-sampling processor.
x-tracing-env: &tracing-env
  TASKAPI_OBSERVABILITY_TRACING_ENABLED: "true"
  TASKAPI_OBSERVABILITY_TRACING_OTLP_ENDPOINT: tempo:4317
  TASKAPI_OBSERVABILITY_TRACING_SAMPLE_RATIO: "1.0"

x-postgres-env: &postgres-env
  TASKAPI_STORAGE_BACKEND: postgres
  TASKAPI_STORAGE_POSTGRES_DSN: postgres://taskapi:${POSTGRES_PASSWORD:-taskapi}@postgres:5432/taskapi?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskapi}
      POSTGRES_DB: taskapi
    # A named volume, so the data survives `compose restart` but `compose
    # down -v` still gives a reviewer a clean slate.
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      # Defaults are tuned for a machine with far less memory than a laptop.
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      # The queue is a high-churn table and its dead tuples must be reclaimed
      # promptly, or the claim query starts scanning them.
      - -c
      - autovacuum_naptime=10s
    healthcheck:
      # -U and -d matter: without them pg_isready checks the wrong database and
      # reports ready before ours exists.
      test: ["CMD-SHELL", "pg_isready -U taskapi -d taskapi"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

  # A one-shot, so nothing races the schema. It runs the same image as the
  # service: a separate migration image is a way to apply one version's schema
  # and then start another version's code.
  migrate:
    <<: *image
    command: ["migrate", "up"]
    environment:
      <<: *postgres-env
      TASKAPI_LOGGING_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *image
    command: ["worker"]
    environment:
      <<: [*postgres-env, *tracing-env]
      TASKAPI_LOGGING_FORMAT: json
      TASKAPI_LOGGING_LEVEL: ${LOG_LEVEL:-info}
      TASKAPI_WEBHOOK_URL: http://webhook-sink:8080/hook
    ports:
      # A different admin port, so both processes can be probed from the host.
      - "${WORKER_ADMIN_PORT:-9091}:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/taskapi", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    # Long enough for the drain to finish in-flight jobs and release what it
    # cannot, rather than leaving them to a lease timeout.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL

  # A sink that can be told to misbehave, so the resilience claims can be
  # demonstrated instead of asserted.
  webhook-sink:
    build:
      # Its own context, not the repository root: the root .dockerignore
      # excludes deploy/, and the sink lives there.
      context: webhook-sink
    image: taskapi-webhook-sink:${VERSION:-dev}
    ports:
      - "${SINK_PORT:-8081}:8080"
    environment:
      SINK_FAIL_RATE: ${SINK_FAIL_RATE:-0}
      SINK_LATENCY: ${SINK_LATENCY:-0s}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M

  api:
    <<: *image
    # serve, not all: the API does not consume the queue. Running the two as
    # separate processes from the same image is what shows the queue is
    # genuinely decoupled — and it makes "kill the worker mid-job and watch the
    # lease reaper" something you can do rather than something claimed.
    command: ["serve"]
    environment:
      <<: [*postgres-env, *tracing-env]
      TASKAPI_LOGGING_FORMAT: json
      TASKAPI_LOGGING_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8080}:8080"
      # Published only so a reviewer can curl it. In a real deployment the
      # admin port stays on the cluster network and never leaves it.
      - "${ADMIN_PORT:-9090}:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The image is distroless and has no shell, so the binary probes itself.
    healthcheck:
      test: ["CMD", "/taskapi", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
    # Limits on every service, so `compose up` cannot eat the reviewer's laptop
    # while they are reading the README.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL

  # Scrapes both processes on their admin port, evaluates the alert rules, and
  # is the datasource the provisioned dashboards read. Pinned to 3.x for native
  # histogram support, which the service emits alongside the classic buckets.
  prometheus:
    image: prom/prometheus:v3.8.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      # Native histograms are what the service emits beside the classic
      # buckets; without this they are ignored on ingest.
      - --enable-feature=native-histograms
      # Without this the exemplars are scraped and discarded, and the "view
      # the trace behind this spike" button has nothing behind it.
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9092}:9090"
    depends_on:
      - api
      - worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Anonymous access with the Admin role, because this is a demo stack on a
  # laptop and a login screen between a reviewer and the dashboards is a
  # dashboard nobody looks at. It is the one deliberate exception to every
  # other hardening choice here, and it stays inside the compose network.
  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      # Opens on the queue dashboard, because that is the one that shows the
      # part of this system worth looking at.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/queue-health.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Traces. The third signal, and the only one that answers "where did the
  # time go inside this one request".
  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  tempo-data:
