<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task API — reference</title>
  </head>
  <body>
    <!--
      The spec is loaded from this same server, so the console always documents
      the build that is actually running. The Scalar bundle comes from a CDN;
      the spec itself is served from the binary at /openapi.yaml and needs no
      network at all.
    -->
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: '/openapi.yaml',
        theme: 'default',
      })
    </script>
  </body>
</html>
